[project]
name = "agentic-unit-test"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["langgraph", "openai", "pytest", "pytest-cov"]

[project.scripts]
unit-agent = "unit_agent.__main__:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["unit_agent"]
package-dir = { unit_agent = "unit-agent" }
